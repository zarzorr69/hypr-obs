name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            os: ubuntu-22.04
          - python: '3.12'
            os: ubuntu-24.04
          - python: '3.14'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test parsing, lifecycle and command installation
        run: python -m unittest discover -s tests -v
      - name: Check shell installer
        run: sh -n install.sh
      - name: Verify generated service syntax
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import hypr_obs
          temporary = Path(os.environ["RUNNER_TEMP"])
          (temporary / "hypr-obs.service").write_text(
              hypr_obs.service_unit(Path(hypr_obs.__file__).resolve(), temporary / "settings.json")
          )
          PY
          systemd-analyze verify "$RUNNER_TEMP/hypr-obs.service"
      - name: Build and smoke-test console entry point
        run: |
          python -m pip install --no-deps .
          hypr-obs --version
          hypr-obs --help
