[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hypr-obs"
version = "0.1.0"
description = "Automatically forward existing OBS hotkeys across Hyprland workspaces"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "zarzorr69"}]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
hypr-obs = "hypr_obs:main"

[project.urls]
Homepage = "https://github.com/zarzorr69/hypr-obs"
Issues = "https://github.com/zarzorr69/hypr-obs/issues"

[tool.setuptools]
py-modules = ["hypr_obs"]
